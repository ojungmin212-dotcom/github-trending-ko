name: Update trending data

on:
  schedule:
    # 매일 22:35 UTC = 다음날 07:35 KST.
    # 00:00 UTC(정각·자정)는 예약이 가장 몰리는 슬롯이라 실제 실행이 4~5시간 밀렸다
    # (2026-10-02~10-09 관측: 매일 13:33~14:36 KST). 혼잡을 피해 정각이 아닌 분으로 옮긴다.
    # GitHub 예약은 원래 지연될 수 있으므로 실제 수집 시각은 data/trending.json의 fetched_at을 볼 것.
    - cron: "35 22 * * *"
  workflow_dispatch:       # Actions 탭의 "Run workflow" 버튼 / gh workflow run

permissions:
  contents: write

concurrency:
  group: update-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub trending
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ github.token }}   # 저장소 메타데이터(라이선스·토픽) 조회용
        run: python scripts/fetch_trending.py

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending.json data/translations.json data/guides.json
          if git diff --cached --quiet; then
            echo "데이터 변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: update trending $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase   # 실행 중에 다른 push가 있었어도 충돌 없이 올라가도록
          git push
